<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5F8B">
<title>Margen</title>
<style>
:root{--bg:#FAFAF7;--sf:#fff;--ink:#1B1B1F;--mut:#5A5F66;--pri:#1F5F8B;--pos:#1B6B4A;--sim:#FFD54F;--simd:#8A6100;--cau:#A34100;--ln:#D9DBD6;--tint:#E6F0F7;--gt:#E3F2EA;--out:#E9EAE5;--onp:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#121316;--sf:#1C1E22;--ink:#ECEDEF;--mut:#A8ADB5;--pri:#8FC3EA;--pos:#7DD3A8;--simd:#FFD54F;--cau:#FFA46B;--ln:#3A3D43;--tint:#1B2B38;--gt:#173324;--out:#000;--onp:#0F1A24;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--out);color:var(--ink);font-variant-numeric:tabular-nums}
#app{position:relative;max-width:430px;height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
@media(min-width:500px){body{padding:1rem}#app{height:min(840px,calc(100dvh - 2rem));border-radius:28px;box-shadow:0 8px 40px #0003}}
main{flex:1;overflow:auto;padding:1rem 1rem 6.5rem}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1{font-size:1.5rem;margin-bottom:.75rem}h2{font-size:1.125rem;margin:1.25rem 0 .25rem}h3{font-size:1rem;margin:1rem 0 .15rem;display:flex;justify-content:space-between;gap:.5rem}
.m{color:var(--mut);font-size:.875rem}small{color:var(--mut);font-size:.8125rem}.pos{color:var(--pos)}
.big{font-size:2.25rem;font-weight:700;line-height:1.2}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:1rem;margin-bottom:.75rem}
.c.g{background:var(--gt);border-color:var(--pos)}

.btn.p{background:var(--pri);color:var(--onp)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.ev{display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:48px;padding:.5rem .75rem;border-radius:12px;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--pri);margin:.3rem 0}
.ev.s{border:2px dashed var(--mut);border-left:2px dashed var(--mut)}
.sim{display:inline-block;background:var(--sim);color:#1B1B1F;border:2px solid var(--simd);border-radius:10px;padding:0 .5rem;font-weight:700}
.bar{height:14px;background:var(--ln);border-radius:7px;overflow:hidden;margin:.6rem 0}
.bar i{display:block;height:100%;width:0;background:var(--pos);transition:width .7s}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.75rem 0}
.top .btn{min-width:48px;padding:0 .8rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cell{min-height:48px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;font:inherit;color:var(--ink);position:relative}
.cell.td{border:2px solid var(--pri);font-weight:700}
.dot{position:absolute;bottom:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pri)}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;overflow-wrap:anywhere;min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:.75rem;color:var(--mut);cursor:pointer}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav [aria-current]{color:var(--pri);font-weight:700;box-shadow:inset 0 3px var(--pri)}
.fab{position:absolute;right:1rem;bottom:calc(76px + env(safe-area-inset-bottom));z-index:3;box-shadow:0 4px 14px #0003}
#ov{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:6}#ov[hidden],#toast[hidden]{display:none}
.sh{background:var(--sf);width:100%;border-radius:24px 24px 0 0;padding:1.25rem 1rem calc(1rem + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select{width:100%;min-height:48px;font:inherit;padding:0 .75rem;border:2px solid var(--mut);border-radius:12px;background:var(--sf);color:var(--ink)}
.btns{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem}
.row{display:flex;gap:.5rem}.row>*{flex:1}
#toast{position:absolute;left:1rem;right:1rem;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:var(--bg);border-radius:16px;padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
#toast .btn{background:var(--bg);min-height:44px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:9;background:#fff;padding:.5rem;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.hd{display:flex;align-items:center;gap:.5rem;justify-content:space-between;margin-bottom:.75rem}.hd h1{margin:0}.hd .btn{min-width:48px;padding:0 .7rem}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.rm *{transition:none!important;animation:none!important}
</style>
</head>

const D0=new Date();D0.setHours(0,0,0,0);

const dq=()=>{if(!P.rem)return 0;for(const r of R)if(r.typ=='due'&&r.amt){const du=nxt(r,TD,1);if(du!=null&&du-TD<=P.rem)return{r,du}}return 0};
const BAN=p=>`<section class="c" style="border-color:var(--pri);background:var(--tint)"><p><b>${t('clBan').replace('{c}',an(p.r.cc)).replace('{r}',rel(p.lc-TD))}</b></p><p class="m">${t('clAsk').replace('{d}',ds(p.du))}</p><button class="btn p" style="margin-top:.5rem" data-a="pay" data-c="${p.r.cc}">${t('payB')}</button></section>`;
const DUE=q=>`<section class="c" style="border-color:var(--cau)"><p><b>${t('duBan').replace('{c}',an(q.r.cc)).replace('{a}',fmt(q.r.amt)).replace('{r}',rel(q.du-TD))}</b></p></section>`;
const OB=()=>{const st=[[R.some(r=>r.typ=='inc'),'ob1'],[A.some(a=>a.kd=='d'),'ob2'],[A.some(a=>a.kd=='c'),'ob3']];if(st.every(x=>x[0]))return'';
return `<section class="c" style="border-color:var(--pri)"><b>${t('obT')}</b><p class="m">${t('obH')}</p>`+st.map(([d,k],i)=>`<div class="ev"><span>${d?'✓ ':''}${t(k)}</span>${d?`<small>${t('done')}</small>`:`<button class="btn" data-a="ob" data-i="${i}">${t('addB')}</button>`}</div>`).join('')+'</section>'};
const FAC=()=>`<details${S.fo?' open':''}><summary style="min-height:48px;display:flex;align-items:center;font-weight:600">${t('fac')}</summary><p class="m">${t('facH')}</p>${F('fdt',t('fdate'),`<input id="fdt" type="date" min="${iso(TD)}" value="${iso(TD)}">`)}<div class="chips" style="margin-top:.75rem"><button class="btn" data-a="smp">${t('smp')}</button><button class="btn" data-a="del">${t('del')}</button></div></details>`;
const SC={
home(){const p=pn(),q=dq(),fr=!A.length&&!R.length;return `<div class="hd"><h1 tabindex="-1">${t('hi')}</h1><button class="btn" data-a="tab" data-t="set" aria-label="${t('set')}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">${GEAR}</svg></button></div>
${P.off?`<p class="m">${t('fday').replace('{d}',ds(TD))}</p>`:''}${OB()}${fr?'':`<section class="c"><p class="m">${t('have')}</p><p class="big">${fmt(bal(TD))}</p><p class="m">${t('est')}</p></section>`}
${fr?'':`<section class="c g"><p class="m">${t('can')}</p><p class="big pos">${fmt(Math.max(0,safe(TD)))}</p><p class="m">${t('why')}</p></section>`}${q?DUE(q):''}
${p?BAN(p):''}<h2>${t('up')}</h2>${upc(3)}
${A.some(a=>a.kd=='d')?`<h2>${t('quick')}</h2><div class="chips">${Q.map((q,i)=>`<button class="btn" data-a="q" data-i="${i}">+ ${t(q.k)} ${fmt(q.amt)}</button>`).join('')}</div>`:''}
<section class="c" style="margin-top:1.25rem"><b>${t('tipT')}</b><p>${t('tip')}</p></section>`},
cal(){const v=S.cv,d=S.cd,f=fd(d);let title,b='';
if(v=='week'){title=ds(d)+' – '+ds(d+6);for(let i=0;i<7;i++){const n=d+i;b+=`<h3><span>${ds(n)}</span><span class="m">${t('bal')} ${fmt(bal(n))}</span></h3>`+evs(n).map(row).join('')}}
else if(v=='day'){title=ds(d,{weekday:'long',day:'numeric',month:'long'});b=`<section class="c"><p class="m">${t('bal')}</p><p class="big">${fmt(bal(d))}</p></section>`+(evs(d).map(row).join('')||`<p class="m">${t('none')}</p>`)}
else{title=f.toLocaleDateString(LOC,{month:'long',year:'numeric'});const first=dn(new Date(f.getFullYear(),f.getMonth(),1)),off=(fd(first).getDay()+6)%7,len=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),m0=dn(new Date(2024,0,1));
b='<div class="grid">';for(let i=0;i<7;i++)b+=`<b class="m" aria-hidden="true">${fd(m0+i).toLocaleDateString(LOC,{weekday:'narrow'})}</b>`;for(let i=0;i<off;i++)b+='<i></i>';
for(let i=1;i<=len;i++){const n=first+i-1,c=evs(n).length;b+=`<button class="cell${n==TD?' td':''}" data-a="day" data-n="${n}" aria-label="${ds(n,{weekday:'long',day:'numeric',month:'long'})}${c?', '+c+' '+t('ev'):''}">${i}${c?'<i class="dot"></i>':''}</button>`}
b+='</div><h2>'+t('up')+'</h2>'+upc(3)}
return `<h1 tabindex="-1">${t('cal')}</h1><label class="vh" for="cv">${t('view')}</label><select id="cv">${op([['week',t('vw')],['day',t('vd')],['month',t('vm')]]).replace(`"${v}"`,`"${v}" selected`)}</select>
<div class="top"><button class="btn" data-a="pv" aria-label="${t('prev')}">‹</button><b>${title}</b><button class="btn" data-a="nx" aria-label="${t('next')}">›</button></div>
<button class="btn" data-a="td" style="margin-bottom:.5rem">${t('today')}</button>${b}`},
sim(){const d=S.sd,tot=S.sl.reduce((s,x)=>s+x.amt,0),sf=safe(d);let r=`<p class="m">${t('empty')}</p>`;
if(tot){const a=sf-tot;let td=d;for(let i=0;i<7;i++)if(bal(d+i)-tot<0){td=d+i;break}
r=`<p aria-live="polite"><b>${a>=0?'✓ '+t('ok').replace('{a}',fmt(a)):'● '+t('tight').replace('{d}',ds(td)).replace('{a}',fmt(Math.max(0,sf)))}</b></p>`;
for(let i=0;i<7;i++){const n=d+i,b=bal(n);r+=`<div class="ev" role="group" aria-label="${ds(n)}: ${fmt(b)} → ${fmt(b-tot)}"><span>${ds(n)}</span><span>${fmt(b)} → <span class="sim">${fmt(b-tot)}</span></span></div>`}}
return `<h1 tabindex="-1">${t('sim')}</h1><label for="sd">${t('sday')}</label><input type="date" id="sd" value="${iso(d)}">
<section class="c" style="margin-top:.75rem"><p class="m">${t('have')}</p><p class="big">${fmt(bal(d))}</p></section>
${R.length?'':`<p class="m">${t('simNo')}</p>`}<h2>${t('plan')}</h2><div class="row"><div><label class="vh" for="sa">${t('amt')}</label><input id="sa" type="number" inputmode="decimal" min="0.01" step="any" placeholder="${t('amt')}"></div><div><label class="vh" for="sc">${t('cat')}</label><select id="sc">${op(CATS.map(c=>[c,t(c)]))}</select></div></div>
<button class="btn p" data-a="as" style="margin:.6rem 0">${t('addS')}</button>
${S.sl.map((x,i)=>`<div class="ev"><span><span class="sim">${t('simd')}</span> ${t(x.cat)} ${fmt(x.amt)}</span><button class="btn" data-a="rs" data-i="${i}">${t('rm')}</button></div>`).join('')}
<section class="c" style="margin-top:.75rem">${r}<p class="m">${t('note')}</p></section>`},
cards(){return `<h1 tabindex="-1">${t('cards')}</h1>`+A.map(a=>`<section class="c"><b>${t(a.kd=='d'?'debit':'credit')} · ${a.n} ••${a.num}</b><p class="big">${fmt(est(a))}</p><p class="m">${t(a.kd=='d'?'est2':'availC')}</p>${a.kd=='c'?`<p class="m">${t('cd').replace('{a}',a.cl).replace('{b}',a.du)}</p>`:''}</section>`).join('')+(A.length?'':`<p>${t('noCard')}</p>`)+`<p class="m">${t('priv')}</p>`},
goals(){return `<h1 tabindex="-1">${t('goals')}</h1>`+(G.length?'':`<p>${t('noGoal')}</p>`)+G.map((g,i)=>{const p=Math.min(100,Math.round(g.sv/g.amt*100)),ti=t('g'+g.p).replace('{a}',fmt(g.amt));
return `<section class="c"><b>${ti}</b><div class="bar" role="progressbar" aria-label="${ti}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-valuetext="${p}%"><i data-w="${p}"></i></div><p class="m">${p}% · ${t('of').replace('{a}',fmt(g.sv)).replace('{b}',fmt(g.amt))}</p><p>${t(p>=100?'g2':p?'g1':'g0')}</p><button class="btn" data-a="gs" data-i="${i}" style="margin-top:.5rem">${t('plus').replace('{a}',fmt(50))}</button></section>`}).join('')},
set(){const o=(id,l,a,v)=>F(id,l,`<select id="${id}">${op(a).replace(`"${v}"`,`"${v}" selected`)}</select>`);
return `<div class="hd"><button class="btn" data-a="tab" data-t="home" aria-label="${t('back')}">‹</button><h1 tabindex="-1">${t('set')}</h1></div>`
+o('sl',t('slang'),[['auto',t('auto')],['es','Español'],['en','English']],P.lang)+o('st',t('stext'),[[100,t('s1')],[125,t('s2')],[150,t('s3')]],P.ts)+o('sh',t('stheme'),[['system',t('auto')],['light',t('light')],['dark',t('dark')]],P.th)+o('sm',t('smot'),[['system',t('auto')],['reduce',t('reduce')]],P.mo)+o('sr',t('srem'),[[0,t('off')],[1,t('d1')],[3,t('d3')],[5,t('d5')]],P.rem)
+`<section class="c" style="margin-top:1.25rem"><b>${t('sample')}</b><p>${t('sampleT')}</p><p class="big">${fmt(1234.5)}</p></section><p class="m">${t('setNote')}</p>`+FAC()}};
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',cards:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',sim:'<path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'};
const FL={home:['add','mov'],cal:['add','mov'],cards:['addC','card'],goals:['addG','goal']};
function render(fid){M.innerHTML=SC[S.tab]();
N.innerHTML=Object.keys(IC).map(k=>`<button data-a="tab" data-t="${k}"${k==S.tab?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${t(k)}</button>`).join('');
const f=FL[S.tab];FAB.hidden=!f;if(f)FAB.innerHTML='<span aria-hidden="true">+ </span>'+t(f[0]);
requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'));
save();if(fid){const e=$('#'+fid);e&&e.focus()}}
function go(k){S.tab=k;render();M.scrollTop=0;const h=M.querySelector('h1');h&&h.focus()}
/* toast + sheets */
let tt;function toast(m,acts=[],ms=6000){clearTimeout(tt);TO.hidden=false;TO.innerHTML=`<span>${m}</span>`;acts.forEach(([l,fn])=>{const b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=()=>{TO.hidden=true;fn()};TO.append(b)});if(ms)tt=setTimeout(()=>TO.hidden=true,ms)}
const lock=v=>[M,N,FAB].forEach(x=>x.inert=v);
function closeSh(){OV.hidden=true;OV.innerHTML='';lock(false);LF&&LF.focus()}
function sheet(title,body,cb,ok){LF=document.activeElement;lock(true);OV.hidden=false;
OV.innerHTML=`<form class="sh" role="dialog" aria-modal="true" aria-labelledby="sht"><h2 id="sht" style="margin-top:0">${title}</h2>${body}<p id="er" role="alert" hidden style="color:var(--cau);font-weight:600;margin-top:.75rem"></p><div class="btns"><button type="button" class="btn" data-a="x">${t('cancel')}</button><button class="btn p">${ok||t('save')}</button></div></form>`;
(OV.querySelector('input,select')||OV.querySelector('button')).focus();OV.querySelector('form').onsubmit=e=>{e.preventDefault();const m=cb(Object.fromEntries(new FormData(e.target)));if(m){const x=$('#er');x.textContent=m;x.hidden=false}else closeSh()}}
const F=(id,l,h)=>`<label for="${id}">${l}</label>${h}`;
const num=(id,l,x='')=>F(id,l,`<input id="${id}" name="${id}" type="number" inputmode="decimal" ${/min=/.test(x)?'':'min="0.01" '}${/step=/.test(x)?'':'step="any" '}required ${x}>`);
function addMov(ty='exp',fr='once'){sheet(t('add'),F('typ',t('type'),`<select id="typ" name="typ">${op([['exp',t('exp')],['inc',t('inc')]]).replace(`"${ty}"`,`"${ty}" selected`)}</select>`)+num('amt',t('amt'))+F('cat',t('cat'),`<select id="cat" name="cat">${op(CATS.map(c=>[c,t(c)]))}</select>`)+F('desc',t('desc'),'<input id="desc" name="desc" maxlength="40">')+F('f',t('rep'),`<select id="f" name="f">${op([['once',t('once')],['daily',t('daily')],['weekly',t('weekly')],['monthly',t('monthly')]]).replace(`"${fr}"`,`"${fr}" selected`)}</select>`)+F('dt',t('date'),`<input id="dt" name="dt" type="date" value="${iso(TD)}" required>`)+F('ac',t('acc'),`<select id="ac" name="ac">${op(A.length?A.map(a=>[a.id,t(a.kd=='d'?'debit':'credit')+' · '+an(a.id)]):[['',t('noacc')]])}</select>`),f=>{
const s=pd(f.dt);R.push({t:f.desc||t(f.cat),typ:f.typ,amt:+f.amt,f:f.f,s,ac:f.ac,pl:f.f!='once',cat:f.cat});render();toast(t('added'),[[t('undo'),()=>{R.pop();render()}]],8000)})}
function addCard(kd='d'){const c0=kd=='c';sheet(t('addC'),F('kd',t('type'),`<select id="kd" name="kd">${op([['d',t('debit')],['c',t('credit')]]).replace(`"${kd}"`,`"${kd}" selected`)}</select>`)+F('n',t('bank'),'<input id="n" name="n" required maxlength="20">')+F('num',t('l4'),'<input id="num" name="num" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>')+`<div class="db"${c0?' hidden':''}>${num('b',t('cur'),(c0?'disabled ':'')+'value="0" min="0"')}</div><div class="cr"${c0?'':' hidden'}>${num('lim',t('lim'),c0?'':'disabled')}${num('cl',t('clo'),(c0?'':'disabled ')+'min="1" max="31" step="1"')}${num('du',t('due'),(c0?'':'disabled ')+'min="1" max="31" step="1"')}</div><p class="m" style="margin-top:.75rem">${t('priv')}</p>`,f=>{
const c=f.kd=='c',id='a'+Date.now();A.push(c?{id,kd:'c',n:f.n,num:f.num,lim:+f.lim,used:0,cl:+f.cl,du:+f.du}:{id,kd:'d',n:f.n,num:f.num,b:+f.b});
if(c){const d1=(A.find(a=>a.kd=='d')||{id:''}).id;R.push({k:'ccl',typ:'cl',amt:0,f:'monthly',s:TD,dom:+f.cl,ac:d1,cc:id,pl:true},{k:'cdu',typ:'due',amt:0,f:'monthly',s:TD,dom:+f.du,ac:d1,cc:id,pl:true})}
render();if(!asked){asked=1;toast(t('rem'),[[t('yes'),()=>{P.rem=3;prefs();try{Notification.requestPermission()}catch(e){}}],[t('later'),()=>{P.rem=0;prefs()}]],0)}})}
function addGoal(){sheet(t('addG'),F('p',t('gper'),`<select id="p" name="p">${op([['w',t('weekly')],['d',t('daily')],['m',t('monthly')]])}</select>`)+num('amt',t('gamt')),f=>{G.push({p:f.p,amt:+f.amt,sv:0});render()})}
function pay(cc){const r=R.find(x=>x.typ=='due'&&x.cc==cc);if(!r)return;const o=r.amt,v=x=>x?`value="${x}"`:'';
sheet(t('payT')+' · '+an(cc),`<p class="m">${t('payH')}</p>`+num('mn',t('mn'),v(r.mn))+num('fl',t('fl'),v(r.fl))+F('pk',t('pk'),`<select id="pk" name="pk">${op([['fl',t('fl')],['mn',t('mn')]])}</select>`),f=>{
if(+f.mn>+f.fl)return t('errMn');r.mn=+f.mn;r.fl=+f.fl;r.amt=f.pk=='fl'?r.fl:r.mn;render();toast(t('payOk'),[[t('undo'),()=>{r.amt=o;render()}]],8000)})}
/* events */
const X={tab:b=>go(b.dataset.t),ob:b=>[()=>addMov('inc','weekly'),()=>addCard('d'),()=>addCard('c')][+b.dataset.i](),
smp:()=>{S.fo=1;sheet(t('smp'),`<p>${t('smpQ')}</p>`,()=>{sample();render();toast(t('smpOk'))},t('smp'))},
del:()=>{S.fo=1;sheet(t('del'),`<p>${t('delQ')}</p>`,()=>{wipe();render();toast(t('delOk'))},t('del'))},pay:b=>pay(b.dataset.c),x:closeSh,fab:()=>({home:addMov,cal:addMov,cards:addCard,goals:addGoal})[S.tab](),
q:b=>{const q=Q[+b.dataset.i];R.push({k:q.k,typ:'exp',amt:q.amt,f:'once',s:TD,ac:(A.find(a=>a.kd=='d')||{id:''}).id,pl:false,cat:q.cat});render();toast(t('added'),[[t('undo'),()=>{R.pop();render()}]],8000)},
pv:()=>step(-1),nx:()=>step(1),td:()=>{S.cd=TD;render()},day:b=>{S.cd=+b.dataset.n;S.cv='day';render()},
as:()=>{const v=+$('#sa').value;if(v>0){S.sl.push({amt:v,cat:$('#sc').value});render('sa')}else $('#sa').focus()},
rs:b=>{S.sl.splice(+b.dataset.i,1);render()},gs:b=>{G[+b.dataset.i].sv+=50;render()}};
function step(s){const v=S.cv;if(v=='month'){const f=fd(S.cd);S.cd=dn(new Date(f.getFullYear(),f.getMonth()+s,1))}else S.cd+=s*(v=='week'?7:1);render()}
$('#app').onclick=e=>{const b=e.target.closest('[data-a]');b&&X[b.dataset.a]&&X[b.dataset.a](b)};
$('#app').onchange=e=>{const i=e.target.id,v=e.target.value;
if(i=='fdt'&&v){const n=pd(v);if(n>TD){P.off=(P.off||0)+n-TD;roll(n);prefs();S.fo=1;render('fdt');toast(t('dateOk').replace('{d}',ds(TD)))}}
const SK={sl:'lang',st:'ts',sh:'th',sm:'mo',sr:'rem'};if(SK[i]){P[SK[i]]=(i=='st'||i=='sr')?+v:v;prefs();render(i)}
if(i=='cv'){S.cv=v;render('cv')}
if(i=='sd'&&v){S.sd=pd(v);render('sd')}
if(i=='kd'){const c=v=='c';OV.querySelector('.cr').hidden=!c;OV.querySelector('.db').hidden=c;OV.querySelectorAll('.cr input').forEach(x=>x.disabled=!c);OV.querySelectorAll('.db input').forEach(x=>x.disabled=c)}};
document.onkeydown=e=>{if(e.key=='Escape'&&!OV.hidden)closeSh()};
render();
if(location.hash=='#add')addMov();
</script>
</body>

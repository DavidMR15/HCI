<html lang="en">

<title>Margen</title>

main{flex:1;overflow:auto;padding:1rem 1rem 6.5rem}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

.m{color:var(--mut);font-size:.875rem}small{color:var(--mut);font-size:.8125rem}.pos{color:var(--pos)}
.big{font-size:2.25rem;font-weight:700;line-height:1.2}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:1rem;margin-bottom:.75rem}
.c.g{background:var(--gt);border-color:var(--pos)}
.btn{min-height:48px;padding:0 1.1rem;border-radius:24px;border:2px solid var(--pri);background:var(--sf);color:var(--pri);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--pri);color:var(--onp)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.ev{display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:48px;padding:.5rem .75rem;border-radius:12px;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--pri);margin:.3rem 0}
.ev.s{border:2px dashed var(--mut);border-left:2px dashed var(--mut)}
.evr{display:flex;align-items:center;gap:.5rem}
.evr .btn.x{min-height:44px;min-width:44px;padding:0 .6rem;border-color:var(--pri);color:var(--pri)}
.sim{display:inline-block;background:var(--sim);color:#1B1B1F;border:2px solid var(--simd);border-radius:10px;padding:0 .5rem;font-weight:700}
.bar{height:14px;background:var(--ln);border-radius:7px;overflow:hidden;margin:.6rem 0}
.bar i{display:block;height:100%;width:0;background:var(--pos);transition:width .7s}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.75rem 0}
.top .btn{min-width:48px;padding:0 .8rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cell{min-height:48px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;font:inherit;color:var(--ink);position:relative}
.cell.td{border:2px solid var(--pri);font-weight:700}
.dot{position:absolute;bottom:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pri)}
nav[hidden]{display:none}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;overflow-wrap:anywhere;min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:.75rem;color:var(--mut);cursor:pointer}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav [aria-current]{color:var(--pri);font-weight:700;box-shadow:inset 0 3px var(--pri)}
.fab{position:absolute;right:1rem;bottom:calc(76px + env(safe-area-inset-bottom));z-index:3;box-shadow:0 4px 14px #0003}
#ov{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:6}#ov[hidden],#toast[hidden]{display:none}
.sh{background:var(--sf);width:100%;border-radius:24px 24px 0 0;padding:1.25rem 1rem calc(1rem + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select{width:100%;min-height:48px;font:inherit;padding:0 .75rem;border:2px solid var(--mut);border-radius:12px;background:var(--sf);color:var(--ink)}
.btns{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem}
.row{display:flex;gap:.5rem}.row>*{flex:1}
#toast{position:absolute;left:1rem;right:1rem;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;background:var(--ink);color:var(--bg);border-radius:16px;padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
#toast .btn{background:var(--bg);min-height:44px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:9;background:#fff;padding:.5rem;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.hd{display:flex;align-items:center;gap:.5rem;justify-content:space-between;margin-bottom:.75rem}.hd h1{margin:0}.hd .btn{min-width:48px;padding:0 .7rem}
.hb{display:flex;gap:.4rem}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.rm *{transition:none!important;animation:none!important}
</style>
</head>
